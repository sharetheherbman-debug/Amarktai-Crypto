# ============================================================================
# Amarktai Network – Primary Nginx Configuration
# ops/nginx/amarktai.conf
#
# INSTALL
#   sudo cp ops/nginx/amarktai.conf /etc/nginx/sites-available/amarktai
#   sudo ln -sf /etc/nginx/sites-available/amarktai /etc/nginx/sites-enabled/amarktai
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

upstream amarktai_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name amarktai.online www.amarktai.online;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amarktai.online www.amarktai.online;

    # SSL (update paths after running certbot)
    ssl_certificate     /etc/letsencrypt/live/amarktai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarktai.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header X-XSS-Protection           "1; mode=block"             always;
    add_header Referrer-Policy            "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10M;

    # Static frontend root – served directly from the build output.
    # This eliminates rsync drift: after `npm run build`, files are live.
    root  /var/amarktai/app/frontend/build;
    index index.html;

    access_log /var/log/nginx/amarktai-access.log;
    error_log  /var/log/nginx/amarktai-error.log warn;

    # ── WebSocket – must come BEFORE /api/ ───────────────────────────────────
    location = /api/ws {
        proxy_pass         http://amarktai_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_connect_timeout 7s;
        proxy_socket_keepalive on;
    }

    location /ws/ {
        proxy_pass         http://amarktai_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_connect_timeout 7s;
        proxy_socket_keepalive on;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://amarktai_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets for 1 year (they are content-hashed by CRA)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|mp3)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Lightweight health check (no backend required) ────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
