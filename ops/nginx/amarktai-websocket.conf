# ============================================================================
# Amarktai Network - Nginx WebSocket Configuration
# ============================================================================
# 
# This configuration snippet enables WebSocket support for the Amarktai
# trading platform. Include this in your main Nginx configuration.
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/amarktai
#   2. Create symlink: ln -s /etc/nginx/sites-available/amarktai /etc/nginx/sites-enabled/
#   3. Test config: nginx -t
#   4. Reload: systemctl reload nginx
#
# Prerequisites:
#   - Backend running on 127.0.0.1:8000
#   - SSL certificates configured (for production WSS)
#   - Ubuntu 24.04 with Nginx 1.18+
#
# ============================================================================

# Upstream backend server
upstream amarktai_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# HTTP to HTTPS redirect (production only)
server {
    listen 80;
    server_name amarktai.online www.amarktai.online;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name amarktai.online www.amarktai.online;
    
    # SSL Certificate paths (update with your actual paths)
    ssl_certificate /etc/letsencrypt/live/amarktai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarktai.online/privkey.pem;
    
    # SSL Configuration (Mozilla Intermediate Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Max upload size
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/amarktai-access.log;
    error_log /var/log/nginx/amarktai-error.log warn;
    
    # Root directory for static files – served directly from the build output
    root /var/amarktai/app/frontend/build;
    index index.html;
    
    # ========================================================================
    # WEBSOCKET ENDPOINT - CRITICAL FOR REALTIME FEATURES
    # ========================================================================
    # This location handles WebSocket upgrades for /api/ws
    # Must be BEFORE the general /api/ proxy to take precedence
    # ========================================================================
    location = /api/ws {
        # Proxy to backend
        proxy_pass http://amarktai_backend;
        
        # WebSocket upgrade headers (REQUIRED)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward original client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings
        # Keep connection alive for up to 1 hour
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Disable buffering for real-time communication
        proxy_buffering off;
        
        # Connection timeout
        proxy_connect_timeout 7s;
        
        # Enable TCP keepalive
        proxy_socket_keepalive on;
    }

    # Decision trace WebSocket (/ws/decisions)
    location /ws/ {
        proxy_pass http://amarktai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_connect_timeout 7s;
        proxy_socket_keepalive on;
    }
    
    # ========================================================================
    # API ENDPOINTS - Backend proxy
    # ========================================================================
    location /api/ {
        # Proxy to backend
        proxy_pass http://amarktai_backend;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for normal HTTP requests
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ========================================================================
    # FRONTEND - React SPA
    # ========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Health check endpoint (optional)
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

