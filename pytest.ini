[pytest]
# Pytest Configuration
# ====================
# Prevents third-party plugin auto-loading (e.g., pytest-ethereum, web3 plugins)
# that can hijack tests and cause crashes.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests backend/tests

# Disable plugin auto-loading (critical for stability)
# This prevents external pip packages from injecting pytest plugins
# Use PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 environment variable as well
addopts = 
    --strict-markers
    --tb=short
    -ra

# Markers for test organization
markers =
    smoke: Smoke tests for critical functionality
    integration: Integration tests requiring external services
    unit: Unit tests for isolated components
    slow: Tests that take significant time to run

# Timeout for tests (prevents hanging tests)
# timeout = 300

# Coverage settings (optional - uncomment to enable)
# [coverage:run]
# source = backend
# omit = 
#     */tests/*
#     */venv/*
#     */__pycache__/*
